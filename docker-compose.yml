services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/synthesis.db
      - GFS_ENABLED=true
      - ECMWF_ENABLED=true
      - ERA5_ENABLED=true
      - ERA5_CDS_URL=https://cds.climate.copernicus.eu/api
      - ERA5_CDS_KEY
      - ERA5_CACHE_DIR=/app/data/era5

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  sqlite_data:
